[workspace]
resolver = "2"
members = [
    "crates/pocket-codex-core",
    "crates/pocket-codex-codex",
    "crates/pocket-codex-pb",
    "crates/pocket-codex-api-proxy",
    "crates/pocket-codex-host-svc",
    "crates/pocket-codex-cli",
    "crates/pocket-codex-bridge",
    "crates/pocket-codex-account-proto",
    "crates/pocket-codex-store",
    "crates/pocket-codex-auth",
    "crates/pocket-codex-backend",
]
# `deps/codex` is a vendored upstream source kept as a git submodule,
# intentionally excluded from this workspace so its own build
# settings/lints/profiles are not entangled with ours; we import the bits
# we need via path deps from individual crates.
#
# `deps/pb-mapper` used to sit here too, alongside the `deps/kanal` and
# `deps/uni-stream` forks it pulled in transitively. All three are gone:
# pb-mapper is a registry dependency now, so its own transitive pins are
# its business rather than something this workspace has to mirror.
exclude = [
    "deps/codex",
    "apps/flutter",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
rust-version = "1.83"
authors = ["Pocket-Codex Contributors"]
license = "Apache-2.0"
repository = "https://github.com/acking-you/pocket-codex"
homepage = "https://github.com/acking-you/pocket-codex"
readme = "README.md"

# Workspace-wide dependency version pins. Individual crates should pull
# from here via `dep = { workspace = true }` so we have a single source
# of truth for upgrades.
[workspace.dependencies]
# The pb-mapper client SDK, from the registry rather than the git submodule it
# used to be. Pinned here so every consumer moves together: a client older than
# the deployed relay cannot decode the relay's structured error frames, which is
# how the 0.2.14-client/0.5.0-relay skew turned an over-quota refusal into an
# unbacked-off reconnect storm.
pb-mapper = "0.5.0"

# Internal crates
pocket-codex-core = { path = "crates/pocket-codex-core" }
pocket-codex-account-proto = { path = "crates/pocket-codex-account-proto" }
pocket-codex-codex = { path = "crates/pocket-codex-codex" }
pocket-codex-pb = { path = "crates/pocket-codex-pb" }
pocket-codex-api-proxy = { path = "crates/pocket-codex-api-proxy" }
pocket-codex-host-svc = { path = "crates/pocket-codex-host-svc" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"

# Serde / config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
toml = "0.8"
# Format-preserving TOML editor: merges generated keys into a possibly
# hand-written codex `config.toml` without clobbering the user's comments /
# ordering (the plain `toml` crate re-serializes and loses them).
toml_edit = "0.22"

# CLI / errors / logging
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Terminal output presentation. `comfy-table` is tilde-pinned to the 7.1
# line: 7.2 bumped its MSRV to 1.85 while this workspace declares
# `rust-version = "1.83"`, and a bare "7.1" is caret (<8.0.0) which would
# still resolve to 7.2. owo-colors stays feature-light (no
# `supports-colors`) so inline styling shares one `use_color()` gate with
# the table path.
comfy-table = "~7.1"
owo-colors = "4"
# Terminal width detection for the boxed-grid fallback. Pinned to the
# 0.28 line so it unifies with the crossterm that comfy-table already
# pulls in transitively (one build, no version split).
crossterm = { version = "0.28", default-features = false }

# Misc
once_cell = "1"
bytes = "1"
http = "1.3"
# rustls (not the default native-tls/OpenSSL) so the CLI links fully static
# against musl — see .github/workflows/release.yml. Trust anchors are the bundled
# WEBPKI (Mozilla) roots, NOT the OS native store: rustls-native-certs does not
# reliably read the Android / iOS system cert store, so `rustls-tls-native-roots`
# yields "invalid peer certificate: UnknownIssuer" on mobile. webpki-roots is
# compiled in → trusts public CAs (Let's Encrypt for the backend, chatgpt.com,
# api.github.com) on every platform. `http2`/`charset` kept; `system-proxy`
# dropped (api_proxy sets reqwest::Proxy explicitly).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "http2", "charset", "rustls-tls-webpki-roots"] }
# Pinned to the 0.28 line to match codex's forked tokio-tungstenite (the
# `embedded-codex` path requires that fork via [patch] below). The fork ships
# `rustls-tls-webpki-roots`, and our WS client only uses the stable
# connect_async / Message API, so this is a drop-in for us.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5"
directories = "5"
which = "6"
nix = { version = "0.29", features = ["signal", "process"] }
sysinfo = "0.32"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Backend-only deps (server crates: store/auth/backend). Kept off
# the static-musl CLI and the mobile bridge closures. All ring/rustls — no
# openssl: sqlx's sqlite backend needs no TLS; jsonwebtoken/oauth2 use ring/rustls.
# sqlx 0.9 (not 0.8) so its bundled `libsqlite3-sys` is 0.37 — the SAME version
# codex's `codex-state` links under the embedded-codex feature. Two crates
# linking native `sqlite3` at different versions is a hard cargo `links`
# conflict, so this MUST track whatever `libsqlite3-sys` codex pins whenever
# deps/codex is bumped (see AGENTS.md §8).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = { version = "9", default-features = false }
sha2 = "0.10"
rand = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-acme = { version = "0.13", default-features = false, features = ["ring", "tokio"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
figment = { version = "0.10", features = ["env", "toml"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# Internal backend crates
pocket-codex-store = { path = "crates/pocket-codex-store" }
pocket-codex-auth = { path = "crates/pocket-codex-auth" }

[workspace.lints.rust]
# Doc coverage is part of the contract — every public item has a comment.
missing_docs = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
empty_docs = "deny"
tabs_in_doc_comments = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"

# Build profiles. Tuned for a CLI / native binary, not a wasm/web app.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# UNWIND, not abort: the desktop app runs codex's app-server IN-PROCESS
# (embedded 自带 mode), so a panic in any codex-spawned task — e.g. a
# per-connection handler reacting to a remote client — must NOT abort the whole
# desktop. With unwind, tokio/std contain a task/thread panic (the bad
# connection dies, the embedded supervisor restarts the server) instead of
# taking down the process. `examples/panic_probe.rs` in pocket-codex-core
# demonstrates the difference. (flutter_rust_bridge also relies on unwinding to
# turn a panic in a bridge call into a Dart exception rather than a hard crash.)
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

# Speed up dev builds: optimise dependencies even in dev profile.
[profile.dev.package."*"]
opt-level = 2

# The `kanal` / `uni-stream` patches that used to live here are gone with the
# pb-mapper submodule. They existed because that submodule declared both as git
# deps on `acking-you/*` branch HEADs, and one of those HEADs renamed a crate out
# from under us — so both forks were vendored and re-routed to keep the build
# reproducible. A registry dependency resolves its own transitive pins from the
# lockfile, so none of that is our problem any more.

# codex (deps/codex) requires forked tokio-tungstenite / tungstenite (they add a
# `proxy` feature on the 0.28 line). The optional `embedded-codex` feature pulls
# codex-app-server, whose transport depends on these forks, so we mirror codex's
# own [patch] table. The forks also expose `rustls-tls-webpki-roots`, so our own
# WS client keeps working. Harmless (unused) when embedded-codex is off.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
