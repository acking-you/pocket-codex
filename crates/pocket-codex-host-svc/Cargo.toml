[package]
name = "pocket-codex-host-svc"
description = "Host-side meta service: remote-viewable codex sessions + per-thread config, exposed through the account broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
# Exposes acp::testing (FakeAgent, DuplexConnector) to other crates' tests.
acp-testing = []

[dependencies]
pocket-codex-core = { workspace = true }
pocket-codex-codex = { workspace = true }
# `json` adds the Json extractor/response and `query` the Query extractor (for
# `/fs/list?path=`) on top of the workspace axum (already linked by the bridge
# via pocket-codex-api-proxy, so this is no new dep in the mobile artifact).
axum = { workspace = true, features = ["json", "query"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true, features = ["compression-zstd", "compression-gzip"] }
# OpenCode client + gateway (`src/opencode`); all already in the lockfile.
reqwest = { workspace = true, features = ["zstd", "gzip"] }
thiserror = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
# ACP hub: RFC 3339 timestamps of listed sessions; already in the lockfile.
chrono = { workspace = true }

# ACP installer (desktop only; kept out of the mobile bridge, see
# scripts/check_mobile_dependencies.py). Only tar and zip are new crates.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
flate2 = "=1.1.9"
semver = "=1.0.28"
sha2 = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user", "signal", "fs"] }

[dev-dependencies]
tempfile = "3"
# Drive the real router over a loopback listener in the HTTP integration test —
# the same rustls-webpki reqwest the bridge's meta client uses, so no new
# workspace dep and the exact request path is exercised.
reqwest = { workspace = true, features = ["zstd", "gzip"] }
# Integration tests under tests/ use acp::testing; paused clocks need test-util.
pocket-codex-host-svc = { path = ".", features = ["acp-testing"] }
tokio = { workspace = true, features = ["test-util"] }
# Raw WebSocket client for the hub transport tests; already in the lockfile.
tokio-tungstenite = { workspace = true }
