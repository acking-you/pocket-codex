[package]
name = "pocket-codex-pb"
description = "Pb-mapper register/subscribe glue used by Pocket-Codex to expose codex app-server remotely."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
pocket-codex-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# The published pb-mapper client SDK. Was a `path` dep on the
# `deps/pb-mapper` submodule pinned at 0.2.14, which is what let the client
# and the (already-0.5) production relay drift apart: the relay answers an
# over-quota register with a structured error frame that a 0.2.x client cannot
# decode, so it read a permanent refusal as a transport fault and retried
# without backoff. Depending on the release removes the skew by construction.
#
# `pb-mapper` is a one-line re-export of `pb_mapper_client::sdk`, which is the
# whole surface we need — no `uni-stream` type parameters to thread any more,
# because the SDK picks the TCP providers itself.
pb-mapper = { workspace = true }

[dev-dependencies]
# Lets the connect-timeout test build a loopback listener with a tiny,
# saturated backlog so a TCP connect hangs without real network access.
socket2 = "0.6"
